name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.2
          working-directory: backend
      - name: Lint OpenAPI contract
        working-directory: backend/api
        run: npx --yes @redocly/cli@1.25.0 lint openapi.yaml
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
      - name: Coverage report
        run: |
          go tool cover -func=coverage.out | tail -n 1
          go tool cover -html=coverage.out -o coverage.html
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.html

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t calculator:ci .
      - name: Smoke test
        run: |
          docker run -d --name calc -p 8080:8080 calculator:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          curl -fsS localhost:8080/ | grep -q '<div id="root">'
          curl -fsS -X POST localhost:8080/api/v1/calculations \
            -H 'Content-Type: application/json' \
            -d '{"operation":"add","operands":[2,3]}' | grep -q '"result":5'
          curl -fsS localhost:8080/api/v1/openapi.yaml | grep -q '^openapi: 3.1.0'
          curl -fsS localhost:8080/docs/ | grep -q '<div id="swagger-ui">'
      - name: Logs
        if: always()
        run: docker logs calc || true
